# Source: the citation section of the academy-agents/academy README
# (github.com/academy-agents/academy). Not written from memory — but please
# sanity-check the venue and page numbers against the published version.
#
# Fields:
#   title       required
#   authors     author list, exactly as published
#   venue       conference / journal / "Preprint"
