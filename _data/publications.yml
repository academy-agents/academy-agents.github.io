#   links       list of {title, url}
#   bibtex      pasted verbatim from the publisher or the project README

# Upstream docs/publications/index.md invites people who use Academy to open a
# PR to be featured. Mirror new entries here when that happens — a growing list
# of papers that *use* Academy is one of the few durable adoption signals a
# research project has.
